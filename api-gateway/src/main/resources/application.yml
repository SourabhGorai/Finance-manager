spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      cache:
        caffeine:
          spec: maximumSize=500,expireAfterWrite=600s

server:
  port: 8080

jwt:
  secret: ${SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
          - routes
  endpoint:
    health:
      show-details: always
    gateway:
      access: read_only

logging:
  level:
    root: INFO
    com.gateway: DEBUG
    com.gateway.api_gateway.filter: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Finance Service
        url: /finance-service/v3/api-docs
  api-docs:
    enabled: true